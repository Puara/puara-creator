name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --all-extras

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Types
        run: uv run mypy

      - name: Tests
        run: uv run pytest -q

      - name: The whole loop against a synthetic phone
        run: |
          set -euo pipefail

          # cued material, with the phone reacting to the cue as a performer would
          uv run puara-creator record \
            --subject CI --device fake-phone --gesture jab \
            --in-port 9099 --bind 127.0.0.1 --corpus /tmp/pcr-corpus \
            --schema schemas/namespace/puara-audience.toml \
            --cue 1.0 --count-in 1 --reps 4 --nominal-rate 100 --idle-timeout 3 \
            --cue-out 127.0.0.1:9199 &
          RECORDER=$!
          sleep 1
          uv run python tools/fake_phone.py --port 9099 --duration 8 --timestamps \
            --cue-in 9199 --reaction-ms 200
          wait $RECORDER

          # matched ambient material, so the false-positive rate is measurable
          uv run puara-creator record \
            --subject CI --device fake-phone --gesture ambient \
            --in-port 9098 --bind 127.0.0.1 --corpus /tmp/pcr-corpus \
            --schema schemas/namespace/puara-audience.toml \
            --cue 0 --nominal-rate 100 --idle-timeout 3 &
          RECORDER=$!
          sleep 1
          uv run python tools/fake_phone.py --port 9098 --duration 8 --timestamps \
            --gesture-every 0
          wait $RECORDER

          for session in /tmp/pcr-corpus/*/; do
            uv run puara-creator label "$session" --method segmenter
          done
          uv run puara-creator inspect /tmp/pcr-corpus

          uv run python examples/threshold_dut.py --listen 9400 --reply 127.0.0.1:9401 &
          DUT=$!
          sleep 1
          uv run puara-creator score /tmp/pcr-corpus \
            --dut osc://127.0.0.1:9400 --class jab --listen 9401 --warmup 0.5 \
            --json /tmp/results.json --report /tmp/report.html
          kill $DUT || true

          uv run python tools/check_results.py /tmp/results.json --min-recall 0.5
